name: pr

# このリポジトリの PR：静的チェックと support/ の単体テストだけを動かす（AWS にはつながない。E2E は流さない）
#   整形の確認・ESLint・型チェック・テストの一覧（設定とテストのファイルが読み込めるか）・ワークフローの書き方（actionlint）
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存の導入
        run: npm ci --no-audit --no-fund

      # ブラウザーは入れない（E2E のシナリオを動かさないため）
      - name: 静的チェック
        run: npm run check

      # support/ の部品の単体テスト（ブラウザー・対象の環境を使わない）
      - name: 単体テスト
        run: npm run test:unit

      # ワークフローの書き方の確認（e2e.yml は呼ぶ側が無いと動かせないため、ここで書き方の誤りを見つける）
      #   版とダイジェストを固定する
      - name: ワークフローの確認（actionlint）
        run: >-
          docker run --rm --volume "${PWD}:/repo" --workdir /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color
